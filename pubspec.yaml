name: weather_app_3d
description: An advanced, widget-based 3D weather app powered by Open-Meteo.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  http: ^1.2.1

  # Location
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # Fonts & UI
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # Utils
  intl: ^0.19.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_map: ^8.4.0-dev.1
  latlong2: ^0.9.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # If you add your own weather icon set / lottie files, declare them here:
  # assets:
  #   - assets/icons/
  #   - assets/lottie/